<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watchtower Widgets</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="page">
    <section class="hero">
      <h1 id="hero-heading" data-testid="hero-heading" class="hero-title">Watchtower Widgets</h1>
      <p class="hero-subtitle">Reliable gadgets, watched around the clock.</p>
    </section>

    <section class="product-card" data-testid="product-card">
      <div class="price-row">
        <span id="price" data-testid="price-value" class="price">$49</span>
        <span class="price-note">one-time</span>
      </div>
      <button id="buy-button" data-testid="buy-button" class="buy-button">Buy Now</button>
      <p id="buy-status" data-testid="buy-status" class="buy-status" aria-live="polite"></p>
    </section>
  </main>
<!-- $49   Buy Now  #38bdf8 -->
  <script src="/script.js"></script>
</body>
</html>
